<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Aurora Keys — an instrument for the browser</title>
    <meta
      name="description"
      content="A pentatonic light-instrument you play with a mouse, a touchscreen, or a keyboard — every combination of notes sounds right."
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Aurora Keys</a>
      </nav>
    </header>
    <main>
      <h1 class="visually-hidden">Aurora Keys</h1>
      <p id="hint" class="hint" aria-live="polite">touch, click, or press a key</p>
      <div id="stage" class="stage" role="group" aria-label="Aurora Keys instrument">
        <!-- pads inserted by main.ts -->
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
